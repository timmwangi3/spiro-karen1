services:
  - type: web
    name: spiro-karen
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spiro-karen-db
          property: connectionString

databases:
  - name: spiro-karen-db
    plan: free
